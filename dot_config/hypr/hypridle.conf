general {
    lock_cmd = pidof hyprlock || hyprlock       # or your preferred lock screen app
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # turn screen on after waking
}

listener {
    timeout = 300                               # 5 minutes in seconds
    on-timeout = loginctl lock-session          # lock session
}

listener {
    timeout = 600                               # 10 minutes in seconds
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'      # turn off monitors
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'     # turn on monitors when activity resumes
}
